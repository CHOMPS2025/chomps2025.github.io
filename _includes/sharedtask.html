{% assign tasks = site.data.sharedtask %}

{% for task in tasks %}
  <div class="row_perso" style="display: flex; align-items: flex-start; margin-bottom: 2em;">

    <!-- Left-side Rectangle Image -->
    <div class="column_perso" style="flex: 0 0 30%; padding-right: 2em;">
      <img src="/images/{{ task.image }}" alt="{{ task.title }}" style="width: 100%; height: auto; border-radius: 8px;">
    </div>

    <!-- Right-side Content -->
    <div class="column_perso" style="flex: 1; display: flex; flex-direction: column; gap: 1em;">

      <!-- Top: Description -->
      <div style="text-align: justify;">
        <h4>{{ task.title }}</h4>
        <p>{{ task.description }}</p>
      </div>

      <!-- Bottom: Timeline / Logistics (text or image) -->
      <div style="display: flex; align-items: center;">
        {% if task.timeline_image %}
          <img src="/images/{{ task.timeline_image }}" alt="Timeline" style="max-width: 100%; height: auto;">
        {% elsif task.timeline_text %}
          <div style="font-size: 0.95em;">
            {{ task.timeline_text }}
          </div>
        {% endif %}
      </div>

    </div>

  </div>
{% endfor %}
