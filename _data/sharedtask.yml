- title: "Shared-task on Hallucinations and Related Observable Overgeneration Mistakes in Crosslingual Analyses of Publications (SHROOM-CAP)"
  image: "shroom-cap.png"
  description: >
          This task is the III edition in the <a href="https://helsinki-nlp.github.io/shroom/">SHROOM</a> shared tasks series. 
          This shared task focuses on evaluating language models for scientific cross-lingual hallucination detection, where we explore the hallucination difference between high resource and low resource languages. 
          

          To participate fill the registration form: <a href="https://forms.gle/hWR9jwTBjZQmFKAE7">https://forms.gle/hWR9jwTBjZQmFKAE7</a> . 
          For more information visit the website: <a href="https://helsinki-nlp.github.io/shroom/2025a">https://helsinki-nlp.github.io/shroom/2025a</a>
